name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist
      - name: Install built wheel and optional features
        run: |
          python -m pip install -r setup_env/requirements.txt
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Smoke import installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from my_toolkit import benchmark, decorator, file, image, logger, mp, text; print('wheel import ok')"
      - name: Run tests
        run: python -m unittest discover -s tests -v
